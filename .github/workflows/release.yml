name: Release

# Runs only when started by hand: Actions → Release → Run workflow, or
# `Scripts/release.sh X.Y.Z` from a terminal. The run creates the vX.Y.Z tag
# on the commit it was started from, so there is nothing to tag beforehand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.14.2 (must match VERSION)"
        type: string
        required: true
      draft:
        description: "Publish as a draft"
        type: boolean
        default: false
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Veil.app
    # macos-26 (Tahoe) ships the macOS 26 SDK. Linking against it is what
    # enables the modern Liquid Glass / Tahoe look — an app built against the
    # macOS 15 SDK renders in legacy style even when run on macOS 26+.
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode 26.5 (Swift 6.3.2). The 26.6 default (Swift 6.3.3) has a
      # compiler regression that makes the release build of this module take
      # ~25 minutes; the same code compiles in ~2 minutes on 6.3.2 and in
      # ~25 seconds on Swift 6.4. Bump back to the default once the runner
      # ships Swift >= 6.4.
      - name: Select Xcode 26.5 (Swift 6.3.2)
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3 (got '$INPUT_VERSION')."
            exit 1
          fi
          # The VERSION file is what the app bakes into its bundle, so a release
          # that disagrees with it would ship a build labelled with the wrong
          # version. Fail early instead: run Scripts/set-version.sh and commit.
          file_version="$(cat VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "::error::version $version does not match VERSION ($file_version) on $GITHUB_REF_NAME."
            echo "::error::Run Scripts/set-version.sh $version, merge it, then run the release again."
            exit 1
          fi
          # Never move or add to a release that already went out.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Fetch core binaries
        run: |
          Scripts/fetch-xray.sh
          Scripts/fetch-singbox.sh
          Scripts/fetch-tun2socks.sh

      - name: Build & test
        run: |
          swift build -c release
          swift test

      - name: Package Veil.app
        run: Scripts/package-app.sh "${{ steps.version.outputs.version }}"

      # The release body is the CHANGELOG section for this version, so what a
      # user reads on the release page is the text that was reviewed in the PR
      # rather than a list of commit subjects.
      - name: Extract the changelog section
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          name: Veil ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/Veil.app.zip

  # The default archive is arm64-only (macos-26 runners are Apple Silicon), so
  # an Intel Mac refuses to open it with "not supported on this Mac". Cross-build
  # a second app with Intel cores and attach it to the same release. It runs
  # after `release` so the two jobs do not race to create the release.
  release-intel:
    name: Build Veil.app for Intel
    needs: release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5 (Swift 6.3.2)
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Fetch core binaries (x86_64)
        env:
          TARGET_ARCH: x86_64
        run: |
          Scripts/fetch-xray.sh
          Scripts/fetch-singbox.sh
          Scripts/fetch-tun2socks.sh

      - name: Build & package Veil.app (x86_64)
        run: Scripts/package-app.sh "${{ needs.release.outputs.version }}" x86_64

      - name: Publish Intel build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/Veil-x86_64.app.zip
