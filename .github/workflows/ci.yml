name: CI

# Runs only when started by hand: Actions → CI → Run workflow, or
# `Scripts/ci.sh [branch] [debug|release]` from a terminal.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build-test:
    name: Build & Test (${{ inputs.configuration }})
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # A release build of this module takes ~25 minutes on the runner's
      # default Swift 6.3.3; Xcode 26.5 (Swift 6.3.2) is what release.yml uses.
      - name: Select Xcode
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          if [ "$CONFIGURATION" = "release" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi

      - name: Show Swift version
        run: swift --version

      - name: Fetch core binaries
        run: |
          Scripts/fetch-xray.sh
          Scripts/fetch-singbox.sh
          Scripts/fetch-tun2socks.sh

      - name: Build
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: swift build -c "$CONFIGURATION"

      - name: Test
        run: swift test
